schema-version: 1
id: codex
display-name: Codex
supported-template-major: 0
instructions:
  entrypoint: AGENTS.md
skills:
  canonical: .agents/skills
  bridge: direct
capabilities:
  outputs:
    - .codex/config.toml
  statuses:
    skills: supported
    mcp: conditional
    hooks: conditional
  role-metadata: purpose, scope, inputs, outputs, validation ownership, escalation conditions
  mcp: configure only through selected project-safe settings; examples are inert
validation:
  offline:
    - codex --version
    - codex --help
    - codex doctor
  live:
    - /debug-config
    - /skills
    - /mcp verbose
    - /hooks
