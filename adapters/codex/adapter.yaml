schema-version: 1
id: codex
adapter-version: 2
display-name: Codex
supported-template-major: 0
instructions:
  entrypoint: AGENTS.md
skills:
  canonical: .agents/skills
  bridge: direct
capabilities:
  outputs:
    - .codex/config.toml
    - .codex/ROLE_NAME.toml
  statuses:
    skills: supported
    mcp: conditional
    hooks: conditional
  role-metadata: purpose, allowed scope, denied scope, inputs, outputs, validation ownership, escalation conditions, capability requirements
  roles: register selected roles with agents.<name>.description and config_file; put the role contract in developer_instructions in the referenced TOML layer
  mcp: configure only through selected project-safe settings; examples are inert
validation:
  offline:
    - verify rendered roles preserve every field of core/roles/ROLE-CONTRACT.md
    - validate rendered config and role TOML against the native Codex configuration schema
    - codex --version
    - codex --help
    - codex doctor
  live:
    - /debug-config
    - /skills
    - /mcp verbose
    - /hooks
