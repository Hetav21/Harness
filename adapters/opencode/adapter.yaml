schema-version: 1
id: opencode
display-name: OpenCode
supported-template-major: 0
instructions:
  entrypoint: AGENTS.md
skills:
  canonical: .agents/skills
  bridge: direct
capabilities:
  outputs:
    - .opencode/agents/
    - .opencode/commands/
    - .opencode/plugins/
    - opencode.json
  statuses:
    skills: supported
    mcp: conditional
    plugins: conditional
  role-metadata: purpose, allowed scope, denied scope, inputs, outputs, validation ownership, escalation conditions, capability requirements
  mcp: inert configuration example; activate only with approved environment variables
validation:
  offline:
    - verify rendered roles preserve every field of core/roles/ROLE-CONTRACT.md
    - opencode --version
    - opencode --help
    - opencode2 --help (optional when installed)
  live:
    - session instruction/skill discovery
    - /mcps
    - local GET /config only when starting a service is approved
